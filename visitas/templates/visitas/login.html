<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Entrar · SNCT IFPI</title>
</head>


<body class="min-h-screen bg-slate-950 text-slate-100 grid place-items-center p-5">
    <main class="w-full max-w-md rounded-3xl bg-white p-8 text-slate-900 shadow-2xl">
        <div class="mb-7 flex flex-col items-center text-center">
            <img src="/static/visitas/23-SNCT4.png" alt="SNCT IFPI" class="h-17 w-auto object-contain">
            <h1 class="mt-2 text-3xl font-black">Acesso do guia</h1>
            <p class="mt-2 text-slate-500">Entre para gerenciar a visitação da sua turma.</p>
        </div>{% if form.errors %}<div role="alert" class="mb-4 rounded-xl bg-red-50 p-3 text-sm text-red-800">Usuário
            ou senha incorretos. Verifique os dados e tente novamente.</div>{% endif %}<form method="post"
            class="space-y-4">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label
                class="block text-sm font-semibold">Usuário<input required autofocus autocomplete="username"
                    name="username" class="mt-1 w-full rounded-xl border border-slate-300 p-3"
                    value="{{ form.username.value|default:'' }}"></label><label
                class="block text-sm font-semibold">Senha<input required autocomplete="current-password" type="password"
                    name="password" class="mt-1 w-full rounded-xl border border-slate-300 p-3"></label><button
                class="w-full rounded-xl bg-emerald-700 p-3 font-bold text-white hover:bg-emerald-800">Entrar</button>
        </form>
    </main>
    <footer class="mt-auto border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        <div class="mx-auto max-w-7xl px-4">
            <p class="font-bold text-slate-700">Desenvolvido por M³ Technology.BR</p>
            <p class="mt-1">SNCT · IFPI Campus Floriano | Sistema de Gestão de Visitações</p>
        </div>
    </footer>
</body>

</html>
